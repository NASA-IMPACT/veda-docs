name: Build to Binder
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Build and cache on mybinder.org
      uses: jupyterhub/repo2docker-action@92fefcbd2b46dd9716f5263a9e740cbc972f6dd9 # master
      with:
        NO_PUSH: true
        MYBINDERORG_TAG: ${{ github.event.ref }}